<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UC1 A/B 비교 · TicTocCroc</title>
<style>
  :root{
    --bg:#F7F7F8; --surface:#FFFFFF; --ink:#19191A; --ink-2:#4A4A4F; --ink-3:#7B7B84;
    --line:#E5E5E6; --brand:#FFC800; --brand-bg:#FFF7CC;
    --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  .wrap{ max-width:1100px; margin:0 auto; padding:28px 20px 28px; }
  .back{ display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; color:var(--ink-3); text-decoration:none; margin-bottom:14px; }
  .back svg{ width:14px; height:14px; }
  h1{ font-size:20px; font-weight:800; letter-spacing:-0.02em; margin:0 0 6px; }
  .sub{ font-size:13.5px; color:var(--ink-3); margin:0 0 22px; }

  .compare{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }

  .mobile-tabs{ display:none; gap:8px; margin-bottom:14px; }
  .mobile-tab{ flex:1; height:40px; border-radius:10px; border:1px solid var(--line); background:#fff;
               font-family:inherit; font-size:14px; font-weight:800; color:var(--ink-3); cursor:pointer; }
  .mobile-tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  @media (max-width:900px){
    .compare{ grid-template-columns:1fr; }
    .mobile-tabs{ display:flex; }
    .compare .col{ display:none; }
    .compare.show-left .col[data-col="left"]{ display:flex; }
    .compare.show-right .col[data-col="right"]{ display:flex; }
  }

  .col{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .col-badge{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
              font-size:13px; font-weight:800; color:#fff; background:#4A4A4F; flex:0 0 auto; }

  .frame-wrap{ width:100%; max-width:380px; height:800px; border-radius:20px; overflow:hidden;
               border:1px solid var(--line); box-shadow:0 14px 32px rgba(0,0,0,.12); background:#fff; overscroll-behavior:contain; }
  .frame-wrap iframe{ width:100%; height:100%; border:0; display:block; }
  @media (max-width:420px){ .frame-wrap{ height:760px; } }

  .poll-section{ display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:20px; }

  .poll-row{ position:relative; width:100%; max-width:380px; height:60px; border-radius:999px;
             background:#fff; overflow:hidden; display:flex; align-items:center; cursor:pointer;
             border:1.5px solid #D7D7DA; box-shadow:0 2px 6px rgba(0,0,0,.06); padding:0; font-family:inherit; text-align:left; }
  .poll-row .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:999px; transition:width .5s ease; }
  .poll-row .chip{ position:relative; z-index:2; background:var(--ink); color:#fff; font-weight:800; font-size:13.5px;
                    padding:9px 16px; border-radius:999px; margin-left:5px; white-space:nowrap; }
  .poll-row .pct{ position:relative; z-index:2; margin-left:auto; margin-right:16px; font-weight:800; font-size:14px; color:var(--ink); display:none; }
  .poll-row.voted{ cursor:default; }

  .vote-hint{ margin-top:16px; padding:12px 16px; border-radius:14px; background:var(--brand-bg); border:1px solid #FFEA80;
              font-size:12.5px; line-height:1.6; color:#5C4400; text-align:center; }
  @media (max-width:480px){
    .frame-wrap{ max-width:100%; border-radius:14px; }
    h1{ font-size:18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="ab-progress.html"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>목록으로</a>
    <h1>UC1 · 체험 진행 순서</h1>
    <p class="sub">두 화면 중 어떤 쪽이 더 나은지 비교해보고, 더 나은 쪽에 투표해보세요.</p>

    <div class="mobile-tabs" id="mobileTabs">
      <button class="mobile-tab active" data-show="left" type="button">A</button>
      <button class="mobile-tab" data-show="right" type="button">B</button>
    </div>

    <div class="compare show-left" id="compareGrid">
      <div class="col" data-col="left">
        <span class="col-badge" data-slot="left">A</span>
        <div class="frame-wrap"><iframe data-slot-src="left" title="UC1 화면 A"></iframe></div>
      </div>
      <div class="col" data-col="right">
        <span class="col-badge" data-slot="right">B</span>
        <div class="frame-wrap"><iframe data-slot-src="right" title="UC1 화면 B"></iframe></div>
      </div>
    </div>

    <div class="poll-section">
      <button class="poll-row" data-vote="left" type="button">
        <span class="fill"></span>
        <span class="chip">A</span>
        <span class="pct"></span>
      </button>
      <button class="poll-row" data-vote="right" type="button">
        <span class="fill"></span>
        <span class="chip">B</span>
        <span class="pct"></span>
      </button>
    </div>

    <div class="vote-hint" id="voteHint">둘 중 더 나은 화면을 골라 투표해보세요. 결과는 실시간으로 반영돼요.</div>
  </div>

  <script type="module">
    import { castVote, watchResults, hasVoted, myChoice } from './vote.js';

    var POLL_ID = 'uc1';
    var variants = [
      { src: 'uc1-original.html?embed=1', choice: 'a' },
      { src: 'uc1-experience-timeline.html?embed=1', choice: 'b' }
    ];
    if (Math.random() < 0.5) variants.reverse();

    var slotChoice = { left: variants[0].choice, right: variants[1].choice };
    document.querySelector('iframe[data-slot-src="left"]').src = variants[0].src;
    document.querySelector('iframe[data-slot-src="right"]').src = variants[1].src;

    var hint = document.getElementById('voteHint');

    function renderResults(result) {
      ['left', 'right'].forEach(function (slot) {
        var choice = slotChoice[slot];
        var pct = result.pct[choice];
        var row = document.querySelector('.poll-row[data-vote="' + slot + '"]');
        row.querySelector('.fill').style.width = pct + '%';
        var pctEl = row.querySelector('.pct');
        pctEl.style.display = 'block';
        pctEl.textContent = pct + '%';
      });
    }

    function lockButtons() {
      ['left', 'right'].forEach(function (slot) {
        var row = document.querySelector('.poll-row[data-vote="' + slot + '"]');
        row.disabled = true;
        row.classList.add('voted');
      });
    }

    document.querySelectorAll('.poll-row').forEach(function (row) {
      row.addEventListener('click', async function () {
        if (row.classList.contains('voted')) return;
        var slot = row.getAttribute('data-vote');
        var choice = slotChoice[slot];
        lockButtons();
        hint.textContent = '투표해주셔서 감사해요! 실시간 결과예요.';
        await castVote(POLL_ID, choice);
      });
    });

    var grid = document.getElementById('compareGrid');
    document.querySelectorAll('.mobile-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        var show = tab.getAttribute('data-show');
        grid.classList.remove('show-left', 'show-right');
        grid.classList.add('show-' + show);
        document.querySelectorAll('.mobile-tab').forEach(function (t) {
          t.classList.toggle('active', t === tab);
        });
      });
    });

    watchResults(POLL_ID, function (result) {
      if (hasVoted(POLL_ID)) {
        lockButtons();
        hint.textContent = '투표해주셔서 감사해요! 실시간 결과예요.';
        renderResults(result);
      }
    });
  </script>
</body>
</html>
