<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시농부 상세페이지 · UC5 · TicTocIsland</title>
<style>
  :root{
    --g10:#F2F2F3; --g20:#E5E5E6; --g30:#D7D7DA; --g40:#BDBDC1;
    --g50:#A3A3A9; --g60:#7B7B84; --g70:#62626A; --g80:#4A4A4F;
    --g90:#313135; --g100:#19191A; --white:#FFFFFF;
    --brand:#FFC800; --brand-bg:#FFF7CC; --brand-line:#FFD500;
    --brand-press:#F5B400; --brand-text:#EBA000; --brand-disable:#FFFBE6;
    --green-10:#E7F8ED; --green-70:#36BB65; --green-90:#288A63;
    --blue:#148ABD; --blue-10:#DFF7FC;
    --pink-70:#F56A9C; --pink-90:#DE3571;
    --bg:#F7F7F8; --surface:#FFFFFF; --sunken:#FAFAFC;
    --ink:#19191A; --ink-2:#4A4A4F; --ink-3:#7B7B84; --ink-4:#A3A3A9;
    --line:#E5E5E6; --line-soft:#F2F2F3;
    --accent:#EBA000;
    --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;
    --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141416; --surface:#1F1F22; --sunken:#19191A;
      --ink:#F2F2F3; --ink-2:#D7D7DA; --ink-3:#A3A3A9; --ink-4:#7B7B84;
      --line:#313135; --line-soft:#26262A; --accent:#FFC800; --blue:#54D6ED;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141416; --surface:#1F1F22; --sunken:#19191A;
    --ink:#F2F2F3; --ink-2:#D7D7DA; --ink-3:#A3A3A9; --ink-4:#7B7B84;
    --line:#313135; --line-soft:#26262A; --accent:#FFC800; --blue:#54D6ED;
  }
  :root[data-theme="light"]{
    --bg:#F7F7F8; --surface:#FFFFFF; --sunken:#FAFAFC;
    --ink:#19191A; --ink-2:#4A4A4F; --ink-3:#7B7B84; --ink-4:#A3A3A9;
    --line:#E5E5E6; --line-soft:#F2F2F3; --accent:#EBA000; --blue:#148ABD;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
        letter-spacing:-0.32px; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:960px; margin:0 auto; padding:40px 24px 80px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  body.embed .wrap{ padding:0; }
  body.embed .fileHead{ display:none; }
  .fileHead{ width:100%; max-width:360px; display:flex; flex-direction:column; gap:4px; }
  .eyebrow{ font-family:var(--sans); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-4); }
  .fileHead h1{ margin:0; font-size:16px; font-weight:700; letter-spacing:-0.02em; color:var(--ink); }

  .phone{ position:relative; width:360px; height:800px; border-radius:0; overflow:hidden;
          background:#FFFFFF; border:1px solid #E5E5E6; box-shadow:0px 20px 44px rgba(0,0,0,.14);
          font-family:var(--sans); letter-spacing:-0.32px; flex:0 0 auto; }
  @media (max-width:420px){ .phone{ width:100%; max-width:360px; height:760px; } }

  .scroller{ position:absolute; inset:0 0 76px 0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .scroller::-webkit-scrollbar{ width:0; }

  .navbar{ height:52px; display:flex; align-items:center; justify-content:space-between;
           padding:0 14px; background:#fff; position:relative; z-index:2; }
  .navbar .nbtn{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; text-decoration:none; color:inherit; }
  .navbar .nbtn svg{ width:22px; height:22px; }
  .navbar b{ font-size:16px; font-weight:700; color:#19191A; }

  .hero{ position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#eee; }
  .hero img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  .body-pad{ padding:18px 18px 26px; display:flex; flex-direction:column; gap:16px; }
  .title-row{ display:flex; flex-direction:column; gap:5px; }
  .title-row h3{ margin:0; font-size:19px; font-weight:700; color:#19191A; letter-spacing:-0.32px; }
  .title-row p{ margin:0; font-size:13px; line-height:1.5; color:#7B7B84; }
  .price-row{ display:flex; align-items:baseline; gap:5px; }
  .price-row b{ font-size:21px; font-weight:700; color:#19191A; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
  .price-row span{ font-size:12.5px; color:#7B7B84; }

  .metabar{ display:flex; border:1px solid #E5E5E6; border-radius:14px; padding:14px 4px; }
  .metabar .m{ flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:12px; color:#4A4A4F; text-align:center; }
  .metabar .m b{ font-weight:700; font-size:12.5px; color:#19191A; }
  .metabar .icwrap{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
  .metabar .icwrap svg{ width:26px; height:26px; }

  .notice-wrap{ position:relative; }
  .notice{ background:#FAFAFC; border:1px solid #F2F2F3; border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
  .notice b{ font-size:12.5px; font-weight:700; color:#19191A; }
  .notice p{ margin:0; font-size:11.5px; line-height:1.6; color:#7B7B84; }
  .proof-badge{ position:absolute; right:-6px; bottom:-10px; transform:rotate(-3deg);
                background:#F56A9C; color:#fff; font-size:11px; font-weight:700; padding:7px 12px;
                border-radius:999px; display:flex; align-items:center; gap:5px; box-shadow:0 4px 10px rgba(245,106,156,.35); white-space:nowrap; }
  .proof-badge svg{ width:13px; height:13px; }

  /* ---- new-feature framing ---- */
  .newblock{ position:relative; border:1.5px dashed #FFC800; border-radius:16px; padding:14px 14px 16px; background:rgba(255,247,204,.35); }
  .newtag{ position:absolute; top:-11px; left:12px; background:#19191A; color:#FFC800; font-family:var(--sans);
           font-size:9.5px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:999px; }
  .am-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:11px; }
  .am-head b{ font-size:13.5px; font-weight:700; color:#19191A; letter-spacing:-0.02em; }
  .am-head span.tail{ font-family:var(--sans); font-size:9px; color:#BDBDC1; letter-spacing:.06em; white-space:nowrap; }

  /* ---- UC3 change banner ---- */
  .chg-banner{ display:flex; gap:11px; align-items:flex-start; }
  .chg-ic{ width:28px; height:28px; border-radius:50%; background:#FFC800; flex:0 0 auto;
           display:flex; align-items:center; justify-content:center; }
  .chg-ic svg{ width:15px; height:15px; color:#19191A; }
  .chg-body{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .chg-body b{ font-size:13px; font-weight:700; color:#19191A; }
  .chg-diff{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:#4A4A4F; flex-wrap:wrap; }
  .chg-old{ text-decoration:line-through; color:#A3A3A9; }
  .chg-new{ color:#EBA000; font-weight:700; }
  .chg-diff svg{ width:11px; height:11px; color:#BDBDC1; flex:0 0 auto; }

  /* ---- UC1 timeline ---- */
  .timeline{ display:flex; flex-direction:column; }
  .tl-step{ position:relative; padding-left:30px; padding-bottom:18px; display:flex; flex-direction:column; gap:7px; }
  .tl-step:last-child{ padding-bottom:0; }
  .tl-dot{ position:absolute; left:0; top:1px; width:20px; height:20px; border-radius:50%; background:#FFC800;
           color:#19191A; font-family:var(--sans); font-weight:700; font-size:10.5px; display:flex;
           align-items:center; justify-content:center; z-index:2; }
  .tl-line{ position:absolute; left:9px; top:21px; bottom:0; width:2px; background:#E5E5E6; }
  .tl-step:last-child .tl-line{ display:none; }
  .tl-photo{ position:relative; border-radius:11px; overflow:hidden; aspect-ratio:2.3/1; display:flex; align-items:center; justify-content:center; }
  .tl-photo.g1{ background:linear-gradient(135deg,#FFF7CC,#FFE9A3); }
  .tl-photo.g2{ background:linear-gradient(135deg,#E7F8ED,#C8F0D6); }
  .tl-photo.g3{ background:linear-gradient(135deg,#FEECF2,#FBD5E4); }
  .tl-photo.g4{ background:linear-gradient(135deg,#DFF7FC,#C3EFF8); }
  .tl-photo.g5{ background:linear-gradient(135deg,#ECD9F4,#D9E3FF); }
  .tl-icon{ width:24px; height:24px; }
  .tl-photo.g1 .tl-icon{ color:#EBA000; } .tl-photo.g2 .tl-icon{ color:#288A63; }
  .tl-photo.g3 .tl-icon{ color:#DE3571; } .tl-photo.g4 .tl-icon{ color:#148ABD; } .tl-photo.g5 .tl-icon{ color:#6B4EA0; }
  .tl-badge{ position:absolute; right:7px; bottom:7px; display:flex; align-items:center; gap:4px; background:rgba(0,0,0,.55); color:#fff; font-size:10px; padding:3px 8px; border-radius:20px; }
  .tl-badge svg{ width:10px; height:10px; }
  .tl-title{ font-size:13px; font-weight:700; color:#19191A; letter-spacing:-0.02em; }
  .tl-desc{ margin:0; font-size:11.5px; line-height:1.5; color:#62626A; }
  .tl-tip{ font-size:10.5px; line-height:1.5; color:#4A4A4F; background:#FAFAFC; border-left:2px solid #FFD500; padding:6px 9px; border-radius:0 8px 8px 0; }

  /* ---- UC2 round list ---- */
  .rounds{ display:flex; flex-direction:column; gap:7px; }
  .rd{ display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:11px; border:1px solid #E5E5E6; background:#FFFFFF; }
  .rd.now{ border-color:#FFD500; background:#FFFBE6; }
  .rd-n{ width:26px; height:26px; border-radius:50%; background:#F2F2F3; color:#4A4A4F; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11.5px; flex:0 0 auto; font-family:var(--sans); }
  .rd.now .rd-n{ background:#FFC800; color:#19191A; }
  .rd.done .rd-n{ background:#E7F8ED; color:#288A63; }
  .rd-body{ display:flex; flex-direction:column; gap:3px; min-width:0; flex:1; }
  .rd-verb{ font-family:var(--sans); font-size:9px; font-weight:700; color:#EBA000; background:#FFF2B3; padding:2px 6px; border-radius:5px; }
  .rd.done .rd-verb{ color:#288A63; background:#D7F4E1; }
  .rd-body b{ font-size:12.5px; font-weight:700; color:#19191A; margin-top:2px; }
  .rd-body span.desc{ font-size:11px; color:#7B7B84; }
  .rd-tag{ font-size:9.5px; font-family:var(--sans); color:#A3A3A9; flex:0 0 auto; }
  .rd.now .rd-tag{ color:#EBA000; font-weight:700; }

  /* ---- UC4 teacher ---- */
  .tcard{ display:flex; gap:11px; }
  .tavatar{ width:48px; height:48px; border-radius:50%; flex:0 0 auto; background:linear-gradient(140deg,#FFE9A3,#FFC800);
            display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#8A5A00; }
  .tinfo{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .tinfo b.name{ font-size:13.5px; font-weight:700; color:#19191A; }
  .tbadges{ display:flex; flex-wrap:wrap; gap:5px; }
  .tbadge{ display:flex; align-items:center; gap:3px; font-size:10px; font-weight:600; color:#288A63; background:#E7F8ED; padding:3px 7px 3px 5px; border-radius:999px; }
  .tbadge svg{ width:10px; height:10px; }
  .thist{ margin:2px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px; }
  .thist li{ font-size:11px; line-height:1.5; color:#4A4A4F; padding-left:11px; position:relative; }
  .thist li::before{ content:''; position:absolute; left:0; top:6px; width:4px; height:4px; border-radius:50%; background:#BDBDC1; }

  /* ---- UC5 amenities ---- */
  .amenity-scroll{ display:flex; gap:14px; overflow-x:auto; overflow-y:visible; padding-top:5px; margin:-5px -14px 0; padding-left:14px; padding-right:14px; padding-bottom:2px; cursor:grab; user-select:none; }
  .amenity-scroll.dragging{ cursor:grabbing; scroll-behavior:auto; }
  .amenity-scroll::-webkit-scrollbar{ height:0; }
  .aitem{ flex:0 0 auto; width:60px; display:flex; flex-direction:column; align-items:center; gap:7px; padding:0; border-radius:0; background:none; border:0; text-align:center; font-family:inherit; cursor:pointer; transition:transform .12s ease; }
  .aitem:active{ transform:scale(0.95); }
  .aitem.hi{ background:#FFFBE6; border-color:#FFEA80; }

  /* ---- amenity bottom sheet ---- */
  .sheet-dim{ position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s; }
  .sheet-dim.show{ opacity:1; pointer-events:auto; }
  .am-sheet{ position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0;
             box-shadow:0 0 16px rgba(0,0,0,.2); transform:translateY(100%); transition:transform .25s cubic-bezier(.2,0,0,1);
             z-index:21; padding:8px 20px 22px; display:flex; flex-direction:column; gap:12px; max-height:70%; overflow-y:auto; }
  .am-sheet.show{ transform:translateY(0); }
  .am-close-row{ display:flex; justify-content:flex-end; padding:2px 0 0; }
  .am-x{ width:28px; height:28px; border-radius:50%; border:0; background:#F4F4F6; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .am-x svg{ width:14px; height:14px; }
  .am-sheet-head{ display:flex; align-items:center; gap:10px; }
  .am-sheet-ic{ width:40px; height:40px; border-radius:50%; background:#FAFAFC; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .am-sheet-ic img{ width:22px; height:22px; object-fit:contain; }
  .am-sheet h4{ margin:0; font-size:16px; font-weight:700; color:#19191A; letter-spacing:-0.02em; }
  .am-blist{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
  .am-blist li{ display:flex; gap:7px; align-items:flex-start; font-size:13px; line-height:1.55; color:#4A4A4F; font-weight:700; }
  .am-blist li::before{ content:''; flex:0 0 auto; width:6px; height:6px; margin-top:6px; border-radius:50%; background:#FFC800; }
  .aitem .ic{ position:relative; width:56px; height:56px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center; box-sizing:border-box; }
  .aitem .ic svg{ width:17px; height:17px; color:#4A4A4F; }
  .aitem .check{ position:absolute; right:-3px; bottom:-3px; width:13px; height:13px; border-radius:50%; background:#36BB65; color:#fff; display:flex; align-items:center; justify-content:center; }
  .aitem .check svg{ width:8px; height:8px; color:#fff; }
  .aitem .check.q{ background:#BDBDC1; font-family:var(--sans); font-size:8.5px; font-weight:700; }
  .aitem .a-check{ position:absolute; right:-2px; top:-2px; width:18px; height:18px; border-radius:50%; background:#36BB65; color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff; }
  .aitem .a-check svg{ width:10px; height:10px; color:#fff; }
  .aitem b{ font-size:11.5px; font-weight:700; color:#19191A; }
  .aitem span.sub{ font-size:9px; color:#7B7B84; }

  /* ---- UC6 benefit ---- */
  .blist{ display:flex; flex-direction:column; gap:10px; }
  .brow{ display:flex; gap:9px; align-items:flex-start; }
  .brow .bic{ width:26px; height:26px; border-radius:8px; background:#FFFFFF; flex:0 0 auto; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .brow .bic svg{ width:14px; height:14px; color:#EBA000; }
  .brow p{ margin:0; font-size:11.5px; line-height:1.55; color:#4A4A4F; }
  .brow p b{ color:#19191A; }

  .cta-bar{ position:absolute; left:0; right:0; bottom:0; height:76px; background:#FFFFFF; border-top:1px solid #E5E5E6;
            display:flex; align-items:center; gap:8px; padding:0 14px 10px; }
  .btn-inquiry{ height:48px; padding:0 16px; border-radius:12px; border:1px solid #D7D7DA; background:#fff; color:#19191A;
                font-family:inherit; font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .btn-inquiry svg{ width:18px; height:18px; color:#4A4A4F; }
  .btn-cta{ flex:1; height:48px; border-radius:12px; border:0; background:#FFC800; color:#19191A;
            font-family:inherit; font-size:15px; font-weight:700; letter-spacing:-0.32px; cursor:pointer; }
</style>
</head>
<body>
<script>if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');</script>
<div class="wrap">
  <div class="fileHead">
    <span class="eyebrow">TicTocIsland · 잠실센터 · 도시농부</span>
    <h1>UC5 · 부모 편의 시설 (아이콘)</h1>
  </div>

  <div class="phone">
    <div class="scroller">

      <div class="navbar">
        <a class="nbtn" href="index.html"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#19191A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <b>잠실센터</b>
        <div class="nbtn"><svg viewBox="0 0 24 24" fill="none"><path d="M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="#19191A" stroke-width="1.6" stroke-linecap="round"/></svg></div>

        <div class="notice-wrap">
          <div class="notice">
            <b>[슬라임 놀이터 패키지 안내]</b>
            <p>프로그램 1회(도시농부 / 드로잉 / 오감 / 그린스튜디오 중 택 1) + 슬라임 놀이터(90분) 이용권이 함께 제공돼요. 그린스튜디오로 변경 시 +3,000원이 추가돼요.</p>
          </div>
        </div>

      </div>
    </div>

    <div class="sheet-dim" id="amDim"></div>
    <div class="am-sheet" id="amSheet">
      <div class="am-close-row"><button class="am-x" type="button" id="amSheetCloseX" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#7B7B84" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <div class="am-sheet-head">
        <div class="am-sheet-ic" id="amSheetIc"></div>
        <h4 id="amSheetTitle"></h4>
      </div>
      <ul class="am-blist" id="amSheetList"></ul>
    </div>

    <div class="cta-bar">
      <button class="btn-inquiry" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H9l-4 4V5z" stroke="#4A4A4F" stroke-width="1.6" stroke-linejoin="round"/></svg>문의</button>
      <button class="btn-cta" type="button">예약하기</button>
    </div>
  </div>
</div>
<script>
(function(){
  var dim = document.getElementById('amDim');
  var sheet = document.getElementById('amSheet');
  var sheetIc = document.getElementById('amSheetIc');
  var sheetTitle = document.getElementById('amSheetTitle');
  var sheetList = document.getElementById('amSheetList');
  var closeBtnX = document.getElementById('amSheetCloseX');
  if(!dim || !sheet) return;

  function openSheet(btn){
    sheetTitle.textContent = btn.getAttribute('data-title') || '';
    var srcImg = btn.querySelector('.ic img');
    sheetIc.innerHTML = srcImg ? srcImg.outerHTML : '';
    var sheetImg = sheetIc.querySelector('img');
    if(sheetImg){ sheetImg.style.width = '22px'; sheetImg.style.height = '22px'; }
    var bullets = (btn.getAttribute('data-bullets') || '').split('|').filter(Boolean);
    sheetList.innerHTML = '';
    bullets.forEach(function(b){
      var li = document.createElement('li');
      li.textContent = b;
      sheetList.appendChild(li);
    });
    dim.classList.add('show');
    sheet.classList.add('show');
  }
  function closeSheet(){
    dim.classList.remove('show');
    sheet.classList.remove('show');
  }

  var dragged = false;
  document.querySelectorAll('.aitem').forEach(function(btn){
    btn.addEventListener('click', function(e){ if(dragged){ e.preventDefault(); return; } openSheet(btn); });
  });
  dim.addEventListener('click', closeSheet);
  if(closeBtnX) closeBtnX.addEventListener('click', closeSheet);

  var scroller = document.querySelector('.amenity-scroll');
  if(scroller){
    var isDown = false, startX = 0, startScroll = 0;
    scroller.addEventListener('mousedown', function(e){
      isDown = true; dragged = false;
      startX = e.pageX; startScroll = scroller.scrollLeft;
      scroller.classList.add('dragging');
    });
    window.addEventListener('mousemove', function(e){
      if(!isDown) return;
      var dx = e.pageX - startX;
      if(Math.abs(dx) > 4) dragged = true;
      scroller.scrollLeft = startScroll - dx;
      e.preventDefault();
    });
    window.addEventListener('mouseup', function(){
      if(!isDown) return;
      isDown = false;
      scroller.classList.remove('dragging');
      setTimeout(function(){ dragged = false; }, 0);
    });
    scroller.addEventListener('wheel', function(e){
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
        scroller.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive:false });
  }
})();
</script>
</body>
</html>
